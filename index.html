<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Page| GitHub Pages</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --card-bg: #161b22;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            padding: 2rem;
            text-align: center;
        }
        h1 { color: white; font-size: 2.5rem; margin-bottom: 0.5rem; }
        p { font-size: 1.1rem; opacity: 0.8; }
        .links { margin-top: 2rem; }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            margin: 5px;
            text-decoration: none;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            border-radius: 6px;
            transition: all 0.3s;
        }
        .btn:hover {
            background-color: var(--accent-color);
            color: var(--bg-color);
        }
        .footer { margin-top: 3rem; font-size: 0.8rem; opacity: 0.5; }
    </style>
</head>
<body>
    <div class="container">
        <h1>👋 Hello，I'm Bitpulese</h1>
        <p>This is my personal page.</p>
        <p>I'm a student at the University of Science and Technology of China.</p>
        
        <div class="links">
            <a href="https://github.com/Bitpulses" class="btn">GitHub Projects</a>
            <a href="https://github.com/Bitpulses" class="btn">Contact Me</a>
        </div>

        <div class="footer">
            &copy; 2026 Powered by GitHub Pages
        </div>
    </div>
</body>
</html>
